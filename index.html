<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ワインディング・フルカウントタイマー</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .timer-card {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
            width: 340px;
        }

        .lap-counter {
            font-size: 18px;
            color: #8e8e93;
            font-weight: bold;
            margin-bottom: 5px;
        }
        #lapDisplay {
            font-size: 28px;
            color: #007aff;
            font-weight: bold;
        }

        #signal {
            font-size: 22px;
            color: #8e8e93;
            font-weight: bold;
            height: 30px;
            margin-top: 15px;
            margin-bottom: 10px;
        }

        #display {
            font-size: 64px;
            font-weight: 200;
            color: #1d1d1f;
            margin-bottom: 30px;
            font-variant-numeric: tabular-nums;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 15px 0;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #startBtn { background-color: #34c759; color: white; }
        #stopBtn  { background-color: #ff3b30; color: white; }
        #resetBtn { background-color: #8e8e93; color: white; }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        button:active:not(:disabled) {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="timer-card">
        <div class="lap-counter">LAP COUNT</div>
        <div id="lapDisplay">0 / 50</div>

        <div id="signal">いつでもどうぞ！</div>
        <div id="display">00:00</div>
        
        <div class="btn-group">
            <button id="startBtn" onclick="pressStart()">スタート</button>
            <button id="stopBtn" onclick="stopTimer()" disabled>ストップ</button>
            <button id="resetBtn" onclick="resetTimer()">リセット</button>
        </div>
    </div>

<script>
    let timerId = null;
    let delayTimeoutId1 = null;
    let delayTimeoutId2 = null;
    let totalSeconds = 0;
    
    let currentLap = 0;       
    const MAX_LAP = 50;       

    // 音声ファイルの読み込み
    const audioYoi = new Audio('yoi.wav');
    const audioHajime = new Audio('hajime.wav');
    const audioAllComplete = new Audio('all_complete.wav');

    // 【変更】1〜25秒のボイスファイルをあらかじめ読み込む
    const countAudios = {};
    for (let i = 1; i <= 25; i++) {
        countAudios[i] = new Audio(`${i}.wav`);
    }

    const lapDisplayDiv = document.getElementById('lapDisplay');
    const signalDiv = document.getElementById('signal');
    const displayDiv = document.getElementById('display');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const resetBtn = document.getElementById('resetBtn');

    function updateDisplay() {
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        const mStr = String(minutes).padStart(2, '0');
        const sStr = String(seconds).padStart(2, '0');
        displayDiv.textContent = `${mStr}:${sStr}`;
    }

    function updateLapDisplay() {
        lapDisplayDiv.textContent = `${currentLap} / ${MAX_LAP}`;
    }

    function pressStart() {
        startBtn.disabled = true;
        resetBtn.disabled = true;
        stopBtn.disabled = false;
        
        if (currentLap === 0) {
            currentLap = 1;
            updateLapDisplay();
            runFirstLoopWithDelay();
        } else {
            startCounting();
        }
    }

    // 初回のみ6秒の準備時間を挟む
    function runFirstLoopWithDelay() {
        totalSeconds = 0;
        updateDisplay();

        signalDiv.textContent = "準備してください……";
        signalDiv.style.color = "#8e8e93";

        delayTimeoutId1 = setTimeout(() => {
            signalDiv.textContent = "よーい……";
            signalDiv.style.color = "#ff9500";
            audioYoi.play().catch(e => console.log("Audio play error:", e));
        }, 3500);

        delayTimeoutId2 = setTimeout(() => {
            signalDiv.textContent = "はじめ！";
            signalDiv.style.color = "#34c759";
            audioHajime.play().catch(e => console.log("Audio play error:", e));

            startCounting();
        }, 6000);
    }

    // カウント計測
    function startCounting() {
        timerId = setInterval(() => {
            totalSeconds++;
            updateDisplay();

            // 【変更】25秒未満でも、まずは「25.wav」までしっかり再生させる
            if (countAudios[totalSeconds]) {
                countAudios[totalSeconds].currentTime = 0;
                countAudios[totalSeconds].play().catch(e => console.log("Audio play error:", e));
            }

            // 25秒に達したときのループ判定
            if (totalSeconds >= 25) {
                clearInterval(timerId);

                if (currentLap >= MAX_LAP) {
                    signalDiv.textContent = "全ラップ終了！";
                    signalDiv.style.color = "#007aff";
                    startBtn.disabled = true;
                    stopBtn.disabled = true;
                    resetBtn.disabled = false;
                    audioAllComplete.play().catch(e => console.log("Audio play error:", e));
                } else {
                    currentLap++;
                    updateLapDisplay();
                    
                    // 「終了です」を挟まず、一瞬で「0秒」に戻して次のラップを即スタート
                    totalSeconds = 0;
                    updateDisplay();
                    signalDiv.textContent = `第 ${currentLap} ラップ 計測中`;
                    signalDiv.style.color = "#34c759";
                    startCounting(); 
                }
            }

        }, 1000);
    }

    function stopTimer() {
        clearInterval(timerId);
        clearTimeout(delayTimeoutId1);
        clearTimeout(delayTimeoutId2);
        
        startBtn.disabled = false;
        resetBtn.disabled = false;
        stopBtn.disabled = true;
        signalDiv.textContent = "一時停止中";
        signalDiv.style.color = "#8e8e93";
    }

    function resetTimer() {
        clearInterval(timerId);
        clearTimeout(delayTimeoutId1);
        clearTimeout(delayTimeoutId2);
        
        totalSeconds = 0;
        currentLap = 0;
        updateDisplay();
        updateLapDisplay();
        
        startBtn.disabled = false;
        stopBtn.disabled = true;
        resetBtn.disabled = true;
        signalDiv.textContent = "いつでもどうぞ！";
        signalDiv.style.color = "#8e8e93";
    }
</script>

</body>
</html>
